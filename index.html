{% extends 'base.html' %}
{% block title %}Trang Chủ{% endblock %}
{% block content %}
<h1 class="text-center">Chào mừng đến Shop Quần Áo</h1>
<div class="row">
    {% for product in products %}
        <div class="col-md-4">
            <div class="card mb-4">
                <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.price }} VND</p>
                    <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-primary">Thêm vào giỏ</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
